<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" role="img" aria-label="Nusra NY — Tax, ITIN and Immigration Form Assistance">
  <defs>
    <linearGradient id="nusra-badge-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2b46"/>
      <stop offset="1" stop-color="#12707a"/>
    </linearGradient>
  </defs>
  <!-- Badge mark: rounded-square, white N with amber closing stroke -->
  <g transform="translate(4 4)">
    <rect width="64" height="64" rx="17" fill="url(#nusra-badge-g)"/>
    <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 47 V17" stroke="#ffffff"/>
      <path d="M19 17 L45 47" stroke="#ffffff"/>
      <path d="M45 17 V47" stroke="#e8922a"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="86" y="35" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.6" fill="#0f2b46">Nusra<tspan fill="#e8922a"> NY</tspan></text>
  <text x="87" y="55" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="2.4" fill="#5c6672">TAX · ITIN · IMMIGRATION FORMS</text>
</svg>
