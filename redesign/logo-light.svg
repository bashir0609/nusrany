  </g>
  <!-- Wordmark -->
  <text x="86" y="35" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.6" fill="#ffffff">Nusra<tspan fill="#ffd9a0"> NY</tspan></text>
  <text x="87" y="55" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="2.4" fill="#b9c8d8">TAX · ITIN · IMMIGRATION FORMS</text>
</svg>
